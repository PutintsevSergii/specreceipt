name: Verify SpecReceipt
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check && npm run build
      - run: npm install --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.14.3
      - run: HARNESS_REAL_OPENSPEC="$RUNNER_TEMP/tools/node_modules/.bin/openspec" npm test
      - run: HARNESS_REAL_OPENSPEC="$RUNNER_TEMP/tools/node_modules/.bin/openspec" python3 scripts/test-wizard.py
      - run: HARNESS_REAL_OPENSPEC="$RUNNER_TEMP/tools/node_modules/.bin/openspec" npm run test:package
      - run: python3 -B harness self-test
  windows-installer-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node --test tests-node/windows.test.mjs

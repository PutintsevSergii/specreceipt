name: Verify SpecReceipt
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.plan.outputs.python }}
      node: ${{ steps.plan.outputs.node }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Explain selected checks
        id: plan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: python
        run: |
          import json, os, subprocess, sys
          output = os.path.join(os.environ['RUNNER_TEMP'], 'test-plan.json')
          profile = 'full' if os.environ['FULL_RUN'] == 'true' else 'changed'
          args = ['--profile', profile, '--dry-run', '--output', output]
          if profile == 'changed':
              base = os.environ.get('PR_BASE') or os.environ.get('PUSH_BEFORE') or 'origin/main'
              if set(base) == {'0'}:
                  base = 'origin/main'
              args += ['--base', base]
          subprocess.check_call([sys.executable, '-B', 'tests/run_scoped.py', *args])
          with open(output) as f:
              plan = json.load(f)
          ids = {entry['id'] for entry in plan['commands']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('python=' + str(bool(ids & {'python', 'validate'})).lower() + '\n')
              f.write('node=' + str(bool(ids - {'python', 'validate'})).lower() + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: selected-test-plan
          path: ${{ runner.temp }}/test-plan.json
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HARNESS_REQUIRE_SYMLINK_TESTS: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize version before Python contracts
        run: node scripts/release.mjs sync
      - name: Initialize local verification state in fresh checkout
        run: python -B -X utf8 harness init
      - uses: actions/download-artifact@v4
        with:
          name: selected-test-plan
          path: ${{ runner.temp }}
      - name: Run selected python checks
        shell: python
        run: |
          import json, os, subprocess, sys
          plan_file = os.path.join(os.environ['RUNNER_TEMP'], 'test-plan.json')
          with open(plan_file) as f:
              plan = json.load(f)
          subprocess.check_call([sys.executable, '-B', 'tests/run_scoped.py', '--profile', plan['profile'], '--plan-file', plan_file, '--language', 'python'])
  verify:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    env:
      HARNESS_PACKAGE_SELF_TEST_MODE: ${{ matrix.node == 24 && 'full' || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm install --prefix "$RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.14.3
      - uses: actions/download-artifact@v4
        with:
          name: selected-test-plan
          path: ${{ runner.temp }}
      - name: Run selected node checks
        shell: python
        run: |
          import json, os, subprocess, sys
          plan_file = os.path.join(os.environ['RUNNER_TEMP'], 'test-plan.json')
          with open(plan_file) as f:
              plan = json.load(f)
          os.environ['HARNESS_REAL_OPENSPEC'] = os.path.join(os.environ['RUNNER_TEMP'], 'tools/node_modules/.bin/openspec' + ('.cmd' if os.name == 'nt' else ''))
          subprocess.check_call([sys.executable, '-B', 'tests/run_scoped.py', '--profile', plan['profile'], '--plan-file', plan_file, '--language', 'node'])
  windows-native:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HARNESS_REQUIRE_SYMLINK_TESTS: '1'
      HARNESS_PACKAGE_SELF_TEST_MODE: ${{ matrix.node == 24 && 'full' || 'smoke' }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install --prefix "$env:RUNNER_TEMP/tools" --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.14.3
      - uses: actions/download-artifact@v4
        with:
          name: selected-test-plan
          path: ${{ runner.temp }}
      - name: Run selected node checks
        shell: python
        run: |
          import json, os, subprocess, sys
          plan_file = os.path.join(os.environ['RUNNER_TEMP'], 'test-plan.json')
          with open(plan_file) as f:
              plan = json.load(f)
          os.environ['HARNESS_REAL_OPENSPEC'] = os.path.join(os.environ['RUNNER_TEMP'], 'tools/node_modules/.bin/openspec' + ('.cmd' if os.name == 'nt' else ''))
          subprocess.check_call([sys.executable, '-B', 'tests/run_scoped.py', '--profile', plan['profile'], '--plan-file', plan_file, '--language', 'node'])
  required:
    if: always()
    needs: [changes, python, verify, windows-native]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or cancelled dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', results
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PY
  publish:
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'PutintsevSergii/specreceipt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check verified main revision is still current
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { publishContext } from './scripts/release.mjs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'},
            signal: AbortSignal.timeout(15000)
          });
          if (!response.ok) throw Error(`Cannot verify main revision: HTTP ${response.status}`);
          const data = await response.json();
          if (!/^[a-f0-9]{40}$/.test(data.object?.sha ?? '')) throw Error('Invalid GitHub ref response');
          const current = publishContext(process.env.GITHUB_EVENT_NAME, process.env.GITHUB_REF,
            process.env.GITHUB_REPOSITORY, 'PutintsevSergii/specreceipt', process.env.GITHUB_SHA, data.object.sha);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `current=${current}\n`);
          console.log(current ? 'Verified main commit is current' : 'Superseded commit: no publication');
          JS
      - name: Synchronize and inspect registry
        if: steps.revision.outputs.current == 'true'
        id: release
        run: |
          node scripts/release.mjs sync
          node scripts/release.mjs registry-check
      - name: Verify npm supports OIDC
        if: steps.release.outputs.publish == 'true'
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { requirePublishingNpm } from './scripts/release.mjs';
          const version = execFileSync('npm', ['--version'], {encoding:'utf8'}).trim();
          requirePublishingNpm(version);
          console.log(`Publishing with npm ${version}`);
          JS
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - name: Build verified version and create tarball
        if: steps.release.outputs.publish == 'true'
        run: |
          npm run check
          npm run build
          npm run version:check
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/packed.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const [pack] = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'packed.json'), 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pack.name !== pkg.name || pack.version !== pkg.version || pack.filename !== `specreceipt-${pkg.version}.tgz`) throw Error('Packed release identity mismatch');
          JS
      - name: Publish through npm Trusted Publishing
        if: steps.release.outputs.publish == 'true'
        run: npm publish "specreceipt-${{ steps.release.outputs.version }}.tgz" --access public --registry=https://registry.npmjs.org --provenance
